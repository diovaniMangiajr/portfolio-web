<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Pessoal — Tailwind CSS</title>

    <!-- Script anti-flash: aplica a classe 'dark' antes da renderização -->
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // Habilita o modo escuro via classe .dark na tag <html>
            theme: {
                extend: {
                    colors: {
                        // Podemos usar a paleta padrão do Tailwind ou definir apelidos
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome (ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS adicional do projeto -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-200 antialiased">

    <!-- SEÇÃO 1: NAVBAR  -->
    <div id="navbar-placeholder"></div>

    <!-- SEÇÃO 2: HEADER / APRESENTAÇÃO -->
    <div id="header-placeholder"></div>

    <!-- SEÇÃO 3: SOBRE -->
    <div id="sobre-placeholder"></div>

    <!-- SEÇÃO 4: HABILIDADES & STACK -->
    <div id="habilidades-placeholder"></div>

    <!-- SEÇÃO 5: PROJETOS -->
    <div id="projetos-placeholder"></div>

    <!-- SEÇÃO 6: INTERESSES -->
    <div id="interesses-placeholder"></div>

    <!-- SEÇÃO 7: CONTATO -->
    <div id="contato-placeholder"></div>

    <!-- SEÇÃO 8: RODAPÉ -->
    <div id="footer-placeholder"></div>

    <!-- Script de lógica da página (Dark Mode e Menu Hambúrguer) -->
    <script src="assets/js/script.js"></script>
</body>
</html>
